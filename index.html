<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Role Based Resume Generating Platform</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="app-title-group">
          <div class="brand-mark" aria-hidden="true">
            <svg class="doc-icon" viewBox="0 0 32 32" focusable="false">
              <path class="doc-page" d="M8 3.5h11.5L26 10v18.5H8z"></path>
              <path class="doc-fold" d="M19.5 3.5V10H26"></path>
              <path d="M12 15h8"></path>
              <path d="M12 19h10"></path>
              <path d="M12 23h7"></path>
              <path d="M10.5 8.5h5"></path>
            </svg>
          </div>
          <div>
            <h1>Role Based Resume Generating Platform</h1>
          </div>
        </div>
      </header>

      <section class="workspace" aria-label="Resume engineering workspace">
        <aside class="panel input-panel">
          <div class="brand-row">
            <h2>Resume Inputs</h2>
          </div>

          <form id="resumeForm" novalidate>
            <section class="form-section">
              <div class="section-heading">
                <h3>Role Details</h3>
                <span></span>
              </div>
              <div class="field-grid three">
                <label>
                  <span>Candidate name</span>
                  <input name="candidateName" placeholder="Example: Namratha" />
                </label>
                <label>
                  <span>Target job title</span>
                  <input name="jobTitle" placeholder="Example: Sitecore Developer" required />
                </label>
                <label>
                  <span>Years of experience</span>
                  <input name="years" type="number" min="0" max="35" step="1" placeholder="Example: 8" required />
                </label>
              </div>

              <label>
                <span>Target job description</span>
                <textarea name="jobDescription" rows="7" placeholder="Paste the target job description here, or upload a job description document below." required></textarea>
              </label>

              <div class="template-tools compact">
                <label class="file-picker">
                  <input id="jobDescriptionFile" type="file" accept=".txt,.md,.html,.docx,.pdf,.doc" />
                  <span>Upload job description doc</span>
                </label>
              </div>
            </section>

            <section class="form-section">
              <div class="section-heading">
                <h3>Template</h3>
                <span></span>
              </div>
              <div class="template-tools">
                <label class="file-picker">
                  <input id="templateFile" type="file" accept=".txt,.md,.html,.docx,.pdf,.doc" multiple />
                  <span>Upload resume templates</span>
                </label>
                <button type="button" id="useSampleBtn">Sample template</button>
              </div>
              <p id="templateUploadValidation" class="upload-validation" aria-live="polite"></p>
              <div id="templateList" class="template-list" aria-live="polite"></div>

              <label>
                <span>Resume template</span>
                <textarea name="template" rows="10" spellcheck="false"></textarea>
              </label>
            </section>

            <section class="form-section">
              <div class="projects-header">
                <div>
                  <h3>Project History</h3>
                  <p>Durations align automatically with total years of experience.</p>
                </div>
                <button type="button" id="addProjectBtn">Add project</button>
              </div>
              <div id="projects"></div>
            </section>

            <button class="primary-action" type="submit">Generate resume</button>
          </form>
        </aside>

        <section class="panel output-panel" aria-label="Generated resume">
          <div class="output-toolbar">
            <div>
              <h2>Skilled Resume</h2>
              <p id="statusText" class="status-message"></p>
            </div>
            <div class="toolbar-actions">
              <button id="copyBtn" type="button" title="Copy resume" disabled>Copy</button>
              <button id="downloadBtn" type="button" title="Download resume" disabled>Download</button>
            </div>
          </div>
          <pre id="resumeOutput" class="resume-output" aria-live="polite"></pre>
        </section>
      </section>
    </main>

    <template id="projectTemplate">
      <article class="project-card">
        <div class="project-card-header">
          <h3>Project</h3>
          <button type="button" class="remove-project" title="Remove project" aria-label="Remove project">×</button>
        </div>
        <div class="field-grid two">
          <label>
            <span>Client name</span>
            <input name="clientName" required />
          </label>
          <label>
            <span>Designation</span>
            <input name="designation" required />
          </label>
          <label>
            <span>Domain</span>
            <input name="domain" required />
          </label>
          <label>
            <span>Cloud provider</span>
            <input name="cloud" placeholder="AWS, Azure, GCP" />
          </label>
        </div>
      </article>
    </template>

    <script src="./app.js"></script>
  </body>
</html>
